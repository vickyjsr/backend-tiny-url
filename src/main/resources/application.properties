# Shared defaults (override per profile / env)
spring.application.name=slashurl-backend
server.port=8080

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/tiny_url?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Hikari
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.data.redis.connect-timeout=2000

# Tomcat
server.tomcat.max-threads=100
server.tomcat.max-connections=2000
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# CORS (comma-separated)
app.cors.allowed-origins=https://slashurl.com,https://www.slashurl.com,http://localhost:3000,http://localhost:3001

# Logging
logging.level.com.tiny.url=INFO
logging.level.org.springframework=INFO

# OpenAPI (enabled outside prod via OpenApiConfig @Profile)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
