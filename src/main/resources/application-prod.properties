spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:mysql://localhost:3306/tiny_url?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=tiny
# Prefer env override in production: export DB_PASSWORD=...
spring.datasource.password=${DB_PASSWORD:tiny097}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Lean defaults for small VMs (override via env if needed)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:8}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.show-sql=false

server.tomcat.max-threads=${TOMCAT_MAX_THREADS:50}
server.tomcat.max-connections=500
server.tomcat.accept-count=50
server.tomcat.connection-timeout=5000

app.cors.allowed-origins=https://slashurl.com,https://www.slashurl.com,http://slashurl.com,http://www.slashurl.com

logging.level.org.springframework=INFO
logging.level.com.tiny.url=INFO
