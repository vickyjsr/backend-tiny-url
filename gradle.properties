# Gradle configuration for low-resource server (1GB RAM)
# Copy this to ~/.gradle/gradle.properties on the server

# Reduce memory usage significantly
org.gradle.jvmargs=-Xmx512m -Xms256m -XX:MaxMetaspaceSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable parallel builds (uses less memory)
org.gradle.parallel=false

# Use only 1 worker (reduces memory pressure)
org.gradle.workers.max=1

# Enable build cache (speeds up subsequent builds)
org.gradle.caching=true

# Reduce logging verbosity
org.gradle.logging.level=warn

# Configure daemon (optional - can disable if still too slow)
# org.gradle.daemon=false

